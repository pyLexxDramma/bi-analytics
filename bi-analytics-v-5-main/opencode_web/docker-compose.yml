# OpenCode web: один процесс, проект /workspace
services:
  opencode:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xca-opencode
    restart: unless-stopped
    network_mode: host
    environment:
      - OPENCODE_EXPERIMENTAL_OUTPUT_TOKEN_MAX=8192
      - OPENCODE_PORT=4096
      - OPENCODE_HOST=127.0.0.1
      - OPENCODE_CONFIG=/workspace/opencode.json
      - XCA_WORKSPACE_DIR=/workspace
      - OPENCODE_DISABLE_DEFAULT_PLUGINS=true
    working_dir: /workspace
    volumes:
      - opencode_config:/root/.config/opencode
      - opencode_share:/root/.local/share/opencode
      - opencode_state:/root/.local/state
      - opencode_cache:/root/.cache
      # Only DB from host; project files come from image COPY (empty ./workspace hides them).
      - ./workspace/web_data.db:/workspace/web_data.db
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4096/global/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 4s
      retries: 30

volumes:
  opencode_config:
  opencode_share:
  opencode_state:
  opencode_cache:
