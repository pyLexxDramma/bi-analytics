# UI из /var/www/xca-ui; API — opencode serve :4097
# __WORKSPACE_SLUG__ подставляется в opencode_entrypoint.sh (base64url /workspace)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream xca_opencode_api {
    server 127.0.0.1:4097;
    keepalive 16;
}

server {
    listen 4096 default_server;
    listen [::]:4096 default_server;
    server_name _;

    root /var/www/xca-ui;
    index index.html;

    client_max_body_size 64m;
    sendfile on;

    # Корень без slug → OpenCode считает directory "/" (slug Lw) → зависание
    location = / {
        return 302 /__WORKSPACE_SLUG__/;
    }

    # Старые закладки /Lw/... (base64url от "/")
    location ~ ^/Lw(/.*)?$ {
        return 302 /__WORKSPACE_SLUG__$1;
    }

    location ~ ^/(global|session|project|config|provider|agent|mcp|doc|pty|path|file|watch|log|event|question|sse|tool|auth|instance|tui|lsp|format|vcs|share|bus|experimental|message|prompt|ui|health|opencode)(/|$) {
        proxy_pass http://xca_opencode_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.(svg|png|ico|webmanifest|woff2?)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
