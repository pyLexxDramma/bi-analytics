# ⚠️ НЕ ИСПОЛЬЗОВАТЬ для кнопки «ИИ помощник» — даёт пустую белую страницу.
#
# OpenCode index.html ссылается на /assets/* и /global/* от корня сайта.
# На ai.conall.ru корень — Streamlit (:8501), поэтому JS/CSS не грузятся.
# Даже location /assets/ → opencode недостаточно: API идёт на /global/* (тоже Streamlit).
#
# Решение: поддомен opencode.conall.ru — см. nginx-opencode-subdomain.conf + certbot.
#
# --- legacy reference (не включать в prod) ---

upstream opencode_backend {
    server 10.35.15.75:4096;
    keepalive 8;
}

location /assets/ {
    proxy_pass http://opencode_backend/assets/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /opencode/ {
    proxy_pass http://opencode_backend/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
