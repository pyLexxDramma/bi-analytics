# Аварийный откат Streamlit на VPS. Push в release больше НЕ деплоит —
# prod UI на ai.conall.ru = Next webapp (showcase workflow_dispatch).
#
# Secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST       - 94.141.105.174 (или DNS)
#   DEPLOY_USER       - dashai
#   DEPLOY_SSH_KEY    - приватный ключ (весь PEM), публичный в ~/.ssh/authorized_keys на сервере
#   DEPLOY_SSH_KEY_PASSPHRASE - если ключ с паролем; для CI лучше отдельный ключ без пароля
#   DEPLOY_SSH_PORT   - опционально, если не 22
#   DEPLOY_APP_DIR    - полный путь к клону на сервере (где streamlit_app.py). Если нет - по умолчанию $HOME/apps/bi-analytics
#   DEPLOY_SYSTEMD_UNIT - имя юнита (например bi-analytics.service) или skip|none - без перезапуска systemd
name: Deploy release

on:
  workflow_dispatch:

concurrency:
  group: deploy-bi-analytics-release-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Add SSH host key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          PORT="${DEPLOY_SSH_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: SSH deploy
        env:
          REMOTE_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          REMOTE_SYSTEMD_UNIT: ${{ secrets.DEPLOY_SYSTEMD_UNIT }}
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_KEY_PASSPHRASE }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          command_timeout: 20m
          envs: REMOTE_APP_DIR,REMOTE_SYSTEMD_UNIT
          script: |
            set -euo pipefail
            APP_DIR="${REMOTE_APP_DIR:-$HOME/apps/bi-analytics}"
            UNIT="${REMOTE_SYSTEMD_UNIT:-bi-analytics.service}"
            export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
            if [[ ! -d "$APP_DIR" ]]; then
              echo "ERROR: каталог не существует: $APP_DIR"
              exit 1
            fi
            cd "$APP_DIR"
            git fetch origin
            git checkout release
            git reset --hard origin/release
            export BI_SYSTEMD_UNIT="${UNIT}"
            export BI_DEPLOY_SKIP_INGEST=1
            export BI_DEPLOY_FAIL_ON_INGEST=0
            if [[ -f bi-analytics-v-5-main/scripts/server_deploy.sh ]]; then
              bash bi-analytics-v-5-main/scripts/server_deploy.sh
            else
              if [[ -x .venv/bin/python ]]; then
                if ! .venv/bin/python -m pip --version &>/dev/null; then
                  curl -fsSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip-gha.py
                  .venv/bin/python /tmp/get-pip-gha.py --no-warn-script-location
                  rm -f /tmp/get-pip-gha.py
                fi
                .venv/bin/python -m pip install --quiet -r requirements.txt
              elif [[ -x .venv/bin/pip ]]; then
                .venv/bin/pip install --quiet -r requirements.txt
              elif python3 -m pip --version &>/dev/null; then
                python3 -m pip install --quiet -r requirements.txt
              else
                curl -fsSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip-gha.py
                python3 /tmp/get-pip-gha.py --user --no-warn-script-location
                rm -f /tmp/get-pip-gha.py
                python3 -m pip install --quiet -r requirements.txt
              fi
              if [[ "$UNIT" != "skip" && "$UNIT" != "none" ]]; then
                LOAD="$(systemctl --user show "$UNIT" --property=LoadState --value 2>/dev/null || echo not-found)"
                if [[ "$LOAD" == "not-found" ]]; then
                  echo "ERROR: unit не найден: $UNIT"
                  exit 5
                fi
                systemctl --user stop "$UNIT" 2>/dev/null || true
                sleep 3
                if command -v ss >/dev/null 2>&1 && ss -tlnp 2>/dev/null | grep -q ':8501 '; then
                  pkill -f 'streamlit.*8501' 2>/dev/null || true
                  sleep 2
                fi
                systemctl --user start "$UNIT"
                for _w in $(seq 1 45); do
                  if systemctl --user is-active "$UNIT" >/dev/null 2>&1; then
                    break
                  fi
                  sleep 1
                done
                systemctl --user is-active "$UNIT" >/dev/null
              fi
            fi
            echo "Deploy OK: $(git rev-parse --short HEAD) in $APP_DIR"
