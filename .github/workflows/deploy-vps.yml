# Аварийный откат Streamlit на ai.conall.ru (только вручную).
# Prod UI = Next webapp (bi-analytics-showcase deploy-ai-conall-prod.yml).
# Secrets: VPS_HOST, VPS_USER, VPS_PORT, VPS_SSH_KEY or VPS_PASSWORD, VPS_DEPLOY_PATH
name: Deploy ai.conall.ru

on:
  workflow_dispatch:

concurrency:
  group: deploy-bi-analytics-release-vps
  cancel-in-progress: false


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 20m
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            git fetch origin
            git checkout release
            git reset --hard origin/release
            echo "HEAD=$(git rev-parse --short HEAD) in $(pwd)"
            export BI_SYSTEMD_UNIT=bi-analytics.service
            export BI_DEPLOY_SKIP_INGEST=1
            export BI_DEPLOY_FAIL_ON_INGEST=0
            if [[ -f bi-analytics-v-5-main/scripts/server_deploy.sh ]]; then
              bash bi-analytics-v-5-main/scripts/server_deploy.sh
              exit 0
            else
              PY=".venv/bin/python"
              [[ -x "$PY" ]] || { python3 -m venv .venv; PY=".venv/bin/python"; }
              "$PY" -m pip install -q -r requirements.txt
              systemctl --user stop bi-analytics.service 2>/dev/null || true
              sleep 2
              systemctl --user start bi-analytics.service
              systemctl --user is-active bi-analytics.service
              echo "Deploy OK (inline)"
            fi
