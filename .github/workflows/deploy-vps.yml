# Автодеплой ai.conall.ru при push в release (после merge main → release).
#
# Отдельно от Deploy release (сервер клиента, секреты DEPLOY_*).
#
# GitHub → Settings → Secrets and variables → Actions:
#   VPS_HOST          — ai.conall.ru или IP
#   VPS_USER          — SSH-пользователь
#   VPS_PORT          — порт SSH (например 2274)
#   VPS_SSH_KEY       — приватный ключ PEM
#   VPS_DEPLOY_PATH   — путь к git-клону на ai.conall.ru
#
name: Deploy ai.conall.ru

on:
  push:
    branches: [release]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 20m
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            git fetch origin
            git checkout release
            git reset --hard origin/release
            DEPLOY_SCRIPT=""
            if [[ -x bi-analytics-v-5-main/scripts/server_deploy.sh ]]; then
              DEPLOY_SCRIPT="bi-analytics-v-5-main/scripts/server_deploy.sh"
            elif [[ -x scripts/server_deploy.sh ]]; then
              DEPLOY_SCRIPT="scripts/server_deploy.sh"
            else
              echo "ERROR: server_deploy.sh not found under $PWD"
              exit 1
            fi
            chmod +x "$DEPLOY_SCRIPT"
            ./"$DEPLOY_SCRIPT"

