# Deploy ai.conall.ru on push to release (same code as release branch).
# Secrets: VPS_HOST, VPS_USER, VPS_PORT, VPS_SSH_KEY or VPS_PASSWORD, VPS_DEPLOY_PATH
name: Deploy ai.conall.ru

on:
  push:
    branches: [release]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 20m
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            git fetch origin
            git checkout release
            git reset --hard origin/release
            echo "HEAD=$(git rev-parse --short HEAD) in $(pwd)"
            if [[ -f bi-analytics-v-5-main/scripts/server_deploy.sh ]]; then
              export BI_DEPLOY_SKIP_SYSTEMD=1
              export BI_DEPLOY_SKIP_INGEST=1
              export BI_DEPLOY_FAIL_ON_INGEST=0
              bash bi-analytics-v-5-main/scripts/server_deploy.sh
            else
              PY=".venv/bin/python"
              if [[ ! -x "$PY" ]]; then
                python3 -m venv .venv
                PY=".venv/bin/python"
              fi
              "$PY" -m pip install -q -r requirements.txt
              echo "Deploy OK (inline pip)"
            fi
