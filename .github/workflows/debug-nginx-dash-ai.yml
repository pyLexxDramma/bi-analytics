# Diagnose HTTPS 403 on ai.conall.ru (nginx on dash-ai-01)
name: Debug nginx dash-ai

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect nginx on dash-ai
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 10m
          envs: VPS_PASSWORD
          script: |
            set -uo pipefail
            echo "=== find GlobalSign / ssl dir refs ==="
            grep -RInE '/etc/nginx/ssl|GlobalSign|default_server|ssl_certificate' /etc/nginx 2>/dev/null | grep -v '.bak' | head -80 || true
            echo "=== ls ssl + letsencrypt ==="
            ls -la /etc/nginx/ssl 2>&1 | head -30
            ls -la /etc/letsencrypt/live/ 2>&1 | head -40
            ls -la /etc/letsencrypt/live/ai.conall.ru/ 2>&1 | head -20
            echo "=== openssl local SNI ai ==="
            echo | openssl s_client -connect 127.0.0.1:443 -servername ai.conall.ru 2>/dev/null | openssl x509 -noout -subject -issuer -dates 2>/dev/null || true
            echo "=== openssl local SNI opencode ==="
            echo | openssl s_client -connect 127.0.0.1:443 -servername opencode.conall.ru 2>/dev/null | openssl x509 -noout -subject -issuer 2>/dev/null || true
            echo "=== openssl public SNI ai ==="
            echo | openssl s_client -connect ai.conall.ru:443 -servername ai.conall.ru 2>/dev/null | openssl x509 -noout -subject -issuer 2>/dev/null || true
            echo "=== sudo nginx -t / -T filter ==="
            printf '%s\n' "${VPS_PASSWORD}" | sudo -S nginx -t 2>&1 | tail -30 || true
            printf '%s\n' "${VPS_PASSWORD}" | sudo -S nginx -T 2>/dev/null | awk '/listen 443|server_name|ssl_certificate |default_server|deny |return 403|ai\.conall|web\.conall|ssl\//' | head -160 || true
            echo "=== error.log ==="
            printf '%s\n' "${VPS_PASSWORD}" | sudo -S tail -n 100 /var/log/nginx/error.log 2>&1 | tail -100 || true
            echo "=== DONE ==="
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
