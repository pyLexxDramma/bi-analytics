# Diagnose HTTPS 403 on ai.conall.ru (nginx on dash-ai-01)
name: Debug nginx dash-ai

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect nginx on dash-ai
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 10m
          script: |
            set -uo pipefail
            echo "=== sites-enabled listing ==="
            ls -la /etc/nginx/sites-enabled/
            echo "=== sites-available listing ==="
            ls -la /etc/nginx/sites-available/
            for f in \
              /etc/nginx/sites-enabled/ai-conall \
              /etc/nginx/sites-available/ai-conall \
              /etc/nginx/sites-enabled/ai-conall-8501-bridge \
              /etc/nginx/sites-available/ai-conall-8501-bridge \
              /etc/nginx/sites-enabled/bi-analytics \
              /etc/nginx/sites-available/bi-analytics \
              /etc/nginx/nginx.conf
            do
              echo "#### FILE $f ####"
              if [[ -r "$f" ]]; then
                # strip private key material if any
                sed -n '1,220p' "$f" | sed '/BEGIN .*PRIVATE KEY/,/END .*PRIVATE KEY/d'
              else
                echo "NOT_READABLE"
              fi
            done
            echo "=== cert paths used ==="
            grep -RIn 'ssl_certificate' /etc/nginx/sites-enabled /etc/nginx/sites-available 2>/dev/null | grep -v '.bak' | head -40 || true
            echo "=== curl + redirect headers ==="
            curl -sS -D - -o /dev/null -k -H "Host: ai.conall.ru" https://127.0.0.1/ | head -30
            curl -sS -D - -o /dev/null http://127.0.0.1/ -H "Host: ai.conall.ru" | head -20
            echo "=== DONE ==="
